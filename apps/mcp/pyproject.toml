[project]
name = "analystos-mcp"
version = "0.1.0"
description = "AnalystOS MCP server (official mcp SDK) exposing workspace analysis tools over the REST API."
requires-python = ">=3.12"
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.scripts]
analystos-mcp = "analystos_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analystos_mcp"]
