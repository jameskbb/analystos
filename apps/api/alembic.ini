# Alembic configuration for the AnalystOS metadata database.
# Usage (from repo root): uv run alembic -c apps/api/alembic.ini upgrade head
# The database URL comes from DATABASE_URL (see analystos_api.config) unless overridden here.
[alembic]
script_location = analystos_api:migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
