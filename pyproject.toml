[project]
name = "analystos-workspace"
version = "0.1.0"
requires-python = ">=3.12"
description = "AnalystOS monorepo root (uv workspace)"
dependencies = [
  "analystos-engine",
  "analystos-investigator",
  "analystos-demo",
  "analystos-api",
  "analystos-mcp",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/engine", "packages/investigator", "packages/demo-data", "apps/api", "apps/mcp"]

[tool.uv.sources]
analystos-engine = { workspace = true }
analystos-investigator = { workspace = true }
analystos-demo = { workspace = true }
analystos-api = { workspace = true }
analystos-mcp = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["packages/engine/tests", "packages/investigator/tests", "packages/demo-data/tests", "apps/api/tests", "apps/mcp/tests", "tests/evals"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
# Third-party libraries without type information (or optional extras).
module = [
  "pandas", "pandas.*", "pyarrow", "pyarrow.*", "scipy", "scipy.*", "sklearn", "sklearn.*",
  "statsmodels", "statsmodels.*", "threadpoolctl", "yaml", "openpyxl", "openpyxl.*", "anthropic", "anthropic.*",
  "weasyprint", "weasyprint.*",
]
ignore_missing_imports = true
