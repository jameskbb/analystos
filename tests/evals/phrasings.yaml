  # --------------------------------------------------------------------------
  # Ambiguity: the right behaviour is to ask
  # --------------------------------------------------------------------------

  - id: amb-01
    story: ambiguity
    speaker: ceo
    register: terse
    question: "How's margin?"
    split: dev
    expect:
      ambiguous_among: [gross_margin, gross_margin_pct, contribution_margin, operating_profit]

  - id: amb-02
    story: ambiguity
    speaker: cfo
    register: terse
    question: "Margin by region last quarter."
    split: holdout
    expect:
      ambiguous_among: [gross_margin, gross_margin_pct, contribution_margin, operating_profit]
      window: 2026-Q2
      breakdown: [region]

  - id: amb-03
    story: ambiguity
    speaker: ceo
    register: terse
    question: "Profit last quarter?"
    split: dev
    expect:
      ambiguous_among: [gross_margin, operating_profit]
      window: 2026-Q2
    note: "Gross profit and operating profit are both governed; contribution margin is a third defensible candidate."

  - id: amb-04
    story: ambiguity
    speaker: sales
    register: casual
    question: "What's our profitability on Contractor?"
    split: dev
    expect:
      ambiguous_among: [gross_margin, gross_margin_pct, contribution_margin, operating_profit]
      filters:
        segment: Contractor
    note: "'Profitability' is a glossary synonym of the ambiguous term Margin."

  - id: amb-05
    story: ambiguity
    speaker: ops
    register: terse
    question: "Costs are up. Why?"
    split: holdout
    expect:
      ambiguous_among: [cogs, operating_expenses]
    note: "'Costs' could be cost of goods, operating expenses or a single line such as freight; a human asks. The candidate list is the minimum."

  - id: amb-06
    story: ambiguity
    speaker: ceo
    register: idiomatic
    question: "Are we making money in West Texas?"
    split: dev
    expect:
      ambiguous_among: [gross_margin, contribution_margin, operating_profit]
      filters:
        region: West Texas
    note: "'Making money' is a profit line without saying which."

  - id: amb-07
    story: ambiguity
    speaker: cfo
    register: terse
    question: "Volume vs last year"
    split: dev
    expect:
      ambiguous_among: [units, orders]
      comparison: yoy
    note: "'Volume' is a synonym of units, and 'order volume', 'lead volume' and 'delivery volume' are synonyms of other metrics; bare 'volume' needs asking."

  - id: amb-08
    story: ambiguity
    speaker: analyst
    register: terse
    question: "Budget vs actual, Q2."
    split: holdout
    expect:
      ambiguous_among: [revenue, gross_margin, operating_profit]
      comparison: budget
      window: 2026-Q2
    note: "Budget versus actual of what? The branch budget carries revenue and gross margin; the plan carries operating profit. A human asks."

  - id: amb-09
    story: ambiguity
    speaker: ceo
    register: idiomatic
    question: "Where are we losing money?"
    split: dev
    expect:
      ambiguous_among: [gross_margin, contribution_margin, operating_profit]
    note: "A profit line, unspecified, with an implied breakdown the analyst would settle after asking."

  - id: amb-10
    story: ambiguity
    speaker: ceo
    register: terse
    question: "Margin in Dallas vs Houston"
    split: dev
    expect:
      ambiguous_among: [gross_margin, gross_margin_pct, contribution_margin, operating_profit]
      comparison: segment

  - id: amb-11
    story: ambiguity
    speaker: sales
    register: casual
    question: "How did the January price increase land?"
    split: holdout
    expect:
      ambiguous_among: [asp, gross_revenue, discount_rate]
    note: "'Price' has no single governed metric: average selling price, list revenue and discount rate all describe it. A human asks what 'land' should be measured by."

  - id: amb-12
    story: ambiguity
    speaker: cfo
    register: casual
    question: "Are we ahead of plan or behind?"
    split: dev
    expect:
      ambiguous_among: [revenue, operating_profit]
      comparison: budget
    note: "Every plan metric is a candidate; the two a CFO most likely means are revenue and operating profit. Period unstated."

  # --------------------------------------------------------------------------
  # Unresolved: no governed metric exists; say so rather than substitute
  # --------------------------------------------------------------------------

  - id: unr-01
    story: unresolved
    speaker: ceo
    register: casual
    question: "What's our customer satisfaction score trend?"
    split: dev
    expect:
      unresolved: true

  - id: unr-02
    story: unresolved
    speaker: ceo
    register: terse
    question: "NPS by region last quarter"
    split: holdout
    expect:
      unresolved: true
    note: "Net promoter score is not in the data or the model."

  - id: unr-03
    story: unresolved
    speaker: cfo
    register: terse
    question: "What's our cash position?"
    split: dev
    expect:
      unresolved: true

  - id: unr-04
    story: unresolved
    speaker: cfo
    register: casual
    question: "How fast are customers paying us? DSO by segment."
    split: dev
    expect:
      unresolved: true
    note: "Payment terms is a dimension, but there is no receivables or days-sales-outstanding metric."

  - id: unr-05
    story: unresolved
    speaker: sales
    register: casual
    question: "What's our customer churn rate this year?"
    split: holdout
    expect:
      unresolved: true
    note: "Active customers is governed; churn (customers lost) is not, and should not be improvised from it without saying so."

  - id: unr-06
    story: unresolved
    speaker: ops
    register: terse
    question: "On-time delivery rate by branch"
    split: dev
    expect:
      unresolved: true
    note: "Ship date exists as a dimension; there is no promised date or on-time metric."

  - id: unr-07
    story: unresolved
    speaker: ops
    register: casual
    question: "How many stockouts did we have last month?"
    split: dev
    expect:
      unresolved: true
    note: "On-hand units is governed at month end; stockout events are not."

  - id: unr-08
    story: unresolved
    speaker: ceo
    register: casual
    question: "What's our market share in Texas?"
    split: holdout
    expect:
      unresolved: true

  - id: unr-09
    story: unresolved
    speaker: cfo
    register: terse
    question: "EBITDA for Q2"
    split: dev
    expect:
      unresolved: true
      window: 2026-Q2
    note: "Operating profit is tagged 'EBIT proxy' but depreciation is not in the data, so EBITDA is not governed. Offering operating profit as the nearest line while saying EBITDA is unavailable is acceptable; silently substituting is not."

  - id: unr-10
    story: unresolved
    speaker: analyst
    register: terse
    question: "Cost per lead by channel, Q2 2026."
    split: dev
    expect:
      unresolved: true
      window: 2026-Q2
    note: "Leads are governed; marketing spend is not in the dataset."

  - id: unr-11
    story: unresolved
    speaker: ops
    register: casual
    question: "Employee turnover by branch this year"
    split: holdout
    expect:
      unresolved: true
    note: "Headcount (FTE) is a level; hires and leavers are not in the data."

  - id: unr-12
    story: unresolved
    speaker: sales
    register: casual
    question: "Average deal size on won opportunities"
    split: dev
    expect:
      unresolved: true
    note: "Pipeline amount and opportunity stage exist, but no won-deal or average deal size metric is governed; an analyst could build one and should say it is not governed."

  - id: unr-13
    story: unresolved
    speaker: cfo
    register: formal
    question: "Net income after tax for Q2 2026."
    split: dev
    expect:
      unresolved: true
      window: 2026-Q2
    note: "The glossary maps 'net profit' to operating profit because tax is held at corporate; 'after tax' explicitly asks for what the data lacks, so the honest answer is that it is unavailable, with operating profit offered as the lowest governed line."

  - id: unr-14
    story: unresolved
    speaker: ops
    register: terse
    question: "Fill rate by category last month"
    split: holdout
    expect:
      unresolved: true

  - id: unr-15
    story: unresolved
    speaker: ceo
    register: casual
    question: "How much web traffic did we get in August?"
    split: dev
    expect:
      unresolved: true
    note: "Web Form is a lead channel; site traffic is not in the data."
