# Phrasing corpus for the AnalystOS question interpreter (Summit Supply Co. demo).
#
# Authorship. This file was written BLIND to the interpreter: the author read the
# README, docs/demo-scenarios.md, docs/semantic-layer.md, the demo semantic model
# (metric ids, dimensions, glossary), the answer key (scenarios.json) and the
# Interpretation fields in models.py, and did not read interpret.py, vocabulary.py,
# commands.py or any existing phrasing test. The questions are written the way a
# CEO, CFO, operations leader, sales leader or analyst would actually put them,
# not the way the matcher parses them. When an entry fails, the question is the
# specification and the interpreter is what changes; do not reword a question or
# loosen an expectation to make the matcher pass.
#
# Reference date ("today") is 2026-09-30. Fiscal year = calendar year. So
# "last quarter" is Q2 2026, "this quarter" is Q3 2026 (in progress), "last month"
# is August 2026, "this month" is September 2026, "last year" is 2025 and
# "this year" is 2026 to date. Lead conversion is cohort based on lead creation.
#
# Entry format
#   id        stable identifier; never renumbered
#   story     which demo story (or corpus slice) the question belongs to:
#             operating_profit_miss_q2_2026, revenue_decline_aug_2026,
#             margin_compression_q2_2026, conversion_decline_q2_2026,
#             inventory_buildup_2026, general (plain lookups, breakdowns, trends),
#             ambiguity (the right behaviour is to ask), unresolved (the right
#             behaviour is to say the metric is not governed)
#   speaker   ceo | cfo | ops | sales | analyst
#   register  terse | casual | idiomatic | formal
#   question  the exact text a stakeholder would type
#   split     dev | holdout (see below)
#   expect    only what a competent human analyst would be confident about
#   note      why an expectation is a judgement call, or what was left out and why
#
# expect fields (all optional; absent means "not asserted", never "must be empty")
#   metric            the governed metric id the question is about
#   metric_any_of     the question is about one of these and a human could read it
#                     either way; any of them is acceptable (rare, always with a note)
#   ambiguous_among   the question must be clarified before running; these are the
#                     candidates a human would offer (the interpreter may list more)
#   unresolved: true  no governed metric exists for what was asked; the right answer
#                     says so instead of substituting a neighbour
#   comparison        pop | yoy | budget | segment | none. "budget" covers plan, AOP,
#                     budget, target and quota, which for FY26 are the same plan.
#   window            2026-Q2 | 2026-08 | 2026 (calendar year to date) |
#                     2026-06-30 (a snapshot date) | 2025-01..2026-09 (a range)
#   baseline          same notation as window; only when the question implies it
#   baseline_metric   the plan/target metric the question names as its yardstick
#   premises          list of {metric, expectation}; expectation is one of
#                     meets_plan | misses_plan | flat | up | down. "meets_plan" on a
#                     cost line means at or under plan; "misses_plan" means over it.
#   filters           {dimension: value} or {dimension: [values]} using semantic
#                     model dimension names and values that exist in the data
#   unresolved_filters  text the question uses as a filter that maps to no governed
#                     dimension value (the interpreter should surface it, not drop it)
#   breakdown         dimension(s) the question asks to split by
#   intent            why_change | compare | breakdown | trend | lookup, only when
#                     it is beyond dispute
#
# dev / holdout split. About a third of the entries are "holdout", chosen at
# authoring time and stratified across stories and speakers so that every story and
# every speaker has holdout coverage. The split is fixed: an entry never moves
# between splits, and new entries get their split assigned when they are added.
# Iterate the interpreter against dev only; run holdout to report generalisation,
# never to tune. A holdout failure is information, not a bug in the corpus.

entries:

  # --------------------------------------------------------------------------
  # Story 0: Q2 2026 operating profit vs the FY26 Operating Plan (the flagship)
  # --------------------------------------------------------------------------

  - id: op-01
    story: operating_profit_miss_q2_2026
    speaker: ceo
    register: casual
    question: "We made our sales number last quarter, but we missed our target for net profit. What happened?"
    split: dev
    expect:
      metric: operating_profit
      comparison: budget
      window: 2026-Q2
      premises:
        - {metric: revenue, expectation: meets_plan}
      intent: why_change
    note: "Net profit resolves to operating profit through the glossary (interest and tax are held at corporate)."

  - id: op-02
    story: operating_profit_miss_q2_2026
    speaker: ceo
    register: terse
    question: "Why did we miss plan on operating profit in Q2?"
    split: holdout
    expect:
      metric: operating_profit
      comparison: budget
      window: 2026-Q2
      intent: why_change

  - id: op-03
    story: operating_profit_miss_q2_2026
    speaker: cfo
    register: formal
    question: "Please explain the Q2 2026 operating profit variance against the FY26 Operating Plan."
    split: dev
    expect:
      metric: operating_profit
      comparison: budget
      window: 2026-Q2
      intent: why_change

  - id: op-04
    story: operating_profit_miss_q2_2026
    speaker: cfo
    register: terse
    question: "Operating profit vs plan last quarter: what explains the gap?"
    split: dev
    expect:
      metric: operating_profit
      comparison: budget
      window: 2026-Q2
      intent: why_change

  - id: op-05
    story: operating_profit_miss_q2_2026
    speaker: ceo
    register: idiomatic
    question: "Top line was fine last quarter, bottom line wasn't. Walk me through it."
    split: holdout
    expect:
      metric: operating_profit
      window: 2026-Q2
      intent: why_change
    note: "Bottom line is a glossary synonym of operating profit. 'Fine' and 'wasn't' do not say against what (plan or last year), so no comparison or premise is asserted; a human would assume plan but could ask."

  - id: op-06
    story: operating_profit_miss_q2_2026
    speaker: ceo
    register: casual
    question: "Revenue hit plan in Q2 but operating income came in way under. Why?"
    split: dev
    expect:
      metric: operating_profit
      comparison: budget
      window: 2026-Q2
      premises:
        - {metric: revenue, expectation: meets_plan}
      intent: why_change

  - id: op-07
    story: operating_profit_miss_q2_2026
    speaker: cfo
    register: terse
    question: "Bridge Q2 operating profit actual to plan."
    split: dev
    expect:
      metric: operating_profit
      comparison: budget
      window: 2026-Q2

  - id: op-08
    story: operating_profit_miss_q2_2026
    speaker: cfo
    register: terse
    question: "Q2 operating profit vs AOP, what drove the miss?"
    split: holdout
    expect:
      metric: operating_profit
      comparison: budget
      window: 2026-Q2
      intent: why_change
    note: "AOP is a glossary synonym of the Operating Plan."

  - id: op-09
    story: operating_profit_miss_q2_2026
    speaker: analyst
    register: formal
    question: "Decompose the Q2 2026 operating profit variance to plan into gross margin and operating expenses."
    split: dev
    expect:
      metric: operating_profit
      comparison: budget
      window: 2026-Q2

  - id: op-10
    story: operating_profit_miss_q2_2026
    speaker: cfo
    register: formal
    question: "Why was gross margin below plan in Q2 2026?"
    split: dev
    expect:
      metric: gross_margin
      comparison: budget
      window: 2026-Q2
      intent: why_change

  - id: op-11
    story: operating_profit_miss_q2_2026
    speaker: cfo
    register: casual
    question: "How far over plan was freight in Q2, and why?"
    split: holdout
    expect:
      metric: freight_cost
      comparison: budget
      window: 2026-Q2

  - id: op-12
    story: operating_profit_miss_q2_2026
    speaker: ops
    register: idiomatic
    question: "Freight blew through budget last quarter. What's going on?"
    split: dev
    expect:
      metric: freight_cost
      comparison: budget
      window: 2026-Q2
      premises:
        - {metric: freight_cost, expectation: misses_plan}
      intent: why_change
    note: "'Blew through budget' states that freight ran over plan; for a cost line that is misses_plan."

  - id: op-13
    story: operating_profit_miss_q2_2026
    speaker: ops
    register: casual
    question: "Was the fuel surcharge the reason freight was over plan in Q2?"
    split: dev
    expect:
      metric_any_of: [freight_cost, fuel_surcharge]
      comparison: budget
      window: 2026-Q2
      premises:
        - {metric: freight_cost, expectation: misses_plan}
    note: "The subject is the freight overrun and the fuel surcharge is the hypothesis, but an analyst who ran the surcharge against plan directly would also answer the question."

  - id: op-14
    story: operating_profit_miss_q2_2026
    speaker: ops
    register: casual
    question: "Why is overtime so far above plan this year?"
    split: holdout
    expect:
      metric: overtime
      comparison: budget
      window: 2026
      premises:
        - {metric: overtime, expectation: misses_plan}
      intent: why_change
    note: "'This year' is 2026 to date (September is the last month with data)."

  - id: op-15
    story: operating_profit_miss_q2_2026
    speaker: ops
    register: terse
    question: "Overtime vs plan Q2 by branch"
    split: dev
    expect:
      metric: overtime
      comparison: budget
      window: 2026-Q2
      breakdown: [branch]

  - id: op-16
    story: operating_profit_miss_q2_2026
    speaker: cfo
    register: casual
    question: "Which branches drove the labor cost overrun last quarter?"
    split: dev
    expect:
      metric: labor_cost
      comparison: budget
      window: 2026-Q2
      breakdown: [branch]
      premises:
        - {metric: labor_cost, expectation: misses_plan}

  - id: op-17
    story: operating_profit_miss_q2_2026
    speaker: ceo
    register: casual
    question: "Are we understaffed? Headcount looks below plan in Austin and San Antonio."
    split: holdout
    expect:
      metric: headcount
      comparison: budget
      filters:
        branch: [Austin, San Antonio]
    note: "No period is named; the reader would take the latest closed months. Headcount is a level (average over a period, never a sum)."

  - id: op-18
    story: operating_profit_miss_q2_2026
    speaker: cfo
    register: formal
    question: "Why did COGS come in above plan in Q2 2026 when revenue was on plan?"
    split: dev
    expect:
      metric: cogs
      comparison: budget
      window: 2026-Q2
      premises:
        - {metric: revenue, expectation: meets_plan}
      intent: why_change

  - id: op-19
    story: operating_profit_miss_q2_2026
    speaker: analyst
    register: formal
    question: "Unit cost vs plan for Lumber in Q2 2026, by supplier."
    split: dev
    expect:
      metric_any_of: [cost_to_list_ratio, standard_unit_cost]
      comparison: budget
      window: 2026-Q2
      filters:
        category: Lumber
      breakdown: [supplier]
    note: "The glossary maps 'unit cost' to COGS per list dollar (the only unit-cost measure with a plan); standard unit cost is the literal reading. 'Mill' and 'vendor' are supplier synonyms."

  - id: op-20
    story: operating_profit_miss_q2_2026
    speaker: ceo
    register: casual
    question: "Did the Gulf States price hike hurt us last quarter?"
    split: holdout
    expect:
      window: 2026-Q2
      filters:
        supplier: Gulf States Forest Products
    note: "'Hurt us' names no metric; a human would ask or default to gross margin. Only the supplier filter and the window are asserted. 'Gulf States' is a partial supplier name."

  - id: op-21
    story: operating_profit_miss_q2_2026
    speaker: sales
    register: casual
    question: "Contractor discounting was way over plan in Q2. Which region?"
    split: dev
    expect:
      metric: discount_rate
      comparison: budget
      window: 2026-Q2
      filters:
        segment: Contractor
      breakdown: [region]
      premises:
        - {metric: discount_rate, expectation: misses_plan}
    note: "'Discounting' is a glossary synonym of discount rate; discount dollars (discount_amount) would be a defensible reading too."

  - id: op-22
    story: operating_profit_miss_q2_2026
    speaker: cfo
    register: terse
    question: "Discount rate vs plan by segment, Q2 2026."
    split: dev
    expect:
      metric: discount_rate
      comparison: budget
      window: 2026-Q2
      breakdown: [segment]

  - id: op-23
    story: operating_profit_miss_q2_2026
    speaker: ceo
    register: idiomatic
    question: "Where did the profit go last quarter? Sales were fine."
    split: holdout
    expect:
      ambiguous_among: [gross_margin, operating_profit]
      window: 2026-Q2
    note: "Bare 'profit' could be gross profit or operating profit; a human asks. 'Sales were fine' is too vague to assert a premise."

  - id: op-24
    story: operating_profit_miss_q2_2026
    speaker: cfo
    register: formal
    question: "For Q2 2026, quantify the operating expense variance to plan by line item."
    split: dev
    expect:
      metric: operating_expenses
      comparison: budget
      window: 2026-Q2

  - id: op-25
    story: operating_profit_miss_q2_2026
    speaker: ops
    register: terse
    question: "Base freight vs plan last quarter"
    split: dev
    expect:
      metric: base_freight
      comparison: budget
      window: 2026-Q2

  - id: op-26
    story: operating_profit_miss_q2_2026
    speaker: ops
    register: casual
    question: "Did delivery volume run ahead of plan in Q2?"
    split: holdout
    expect:
      metric: deliveries
      comparison: budget
      window: 2026-Q2

  - id: op-27
    story: operating_profit_miss_q2_2026
    speaker: sales
    register: idiomatic
    question: "We hit quota last quarter. Why is finance saying we missed?"
    split: dev
    expect:
      ambiguous_among: [operating_profit, gross_margin]
      window: 2026-Q2
      premises:
        - {metric: revenue, expectation: meets_plan}
    note: "'Missed' has no subject; the right move is to ask what was missed. The candidate list is a judgement: the profit lines are what finance would be talking about."

  - id: op-28
    story: operating_profit_miss_q2_2026
    speaker: analyst
    register: terse
    question: "Operating margin % actual vs plan for Q2 2026."
    split: holdout
    expect:
      metric: operating_margin_pct
      comparison: budget
      window: 2026-Q2

  - id: op-29
    story: operating_profit_miss_q2_2026
    speaker: ceo
    register: casual
    question: "Payroll was under plan last quarter, so why is labor over?"
    split: dev
    expect:
      metric: labor_cost
      comparison: budget
      window: 2026-Q2
      premises:
        - {metric: payroll, expectation: meets_plan}
        - {metric: labor_cost, expectation: misses_plan}
      intent: why_change
    note: "Payroll under plan is favourable for a cost line, hence meets_plan."

  - id: op-30
    story: operating_profit_miss_q2_2026
    speaker: ops
    register: terse
    question: "Compare Q2 2026 headcount to the plan by branch."
    split: dev
    expect:
      metric: headcount
      comparison: budget
      window: 2026-Q2
      breakdown: [branch]

  - id: op-31
    story: operating_profit_miss_q2_2026
    speaker: ops
    register: terse
    question: "Labor is over. Which branch?"
    split: holdout
    expect:
      metric: labor_cost
      comparison: budget
      breakdown: [branch]
      premises:
        - {metric: labor_cost, expectation: misses_plan}
    note: "'Over' with no yardstick means over plan to an ops leader. No period is named."

  - id: op-32
    story: operating_profit_miss_q2_2026
    speaker: cfo
    register: casual
    question: "Revenue landed on plan in Q2, but was that true for every segment?"
    split: dev
    expect:
      metric: revenue
      comparison: budget
      window: 2026-Q2
      breakdown: [segment]
      premises:
        - {metric: revenue, expectation: meets_plan}

  # --------------------------------------------------------------------------
  # Story 1: August 2026 revenue decline vs July 2026
  # --------------------------------------------------------------------------

  - id: aug-01
    story: revenue_decline_aug_2026
    speaker: ceo
    register: casual
    question: "Why was August revenue down?"
    split: dev
    expect:
      metric: revenue
      comparison: pop
      window: 2026-08
      baseline: 2026-07
      premises:
        - {metric: revenue, expectation: down}
      intent: why_change
    note: "No baseline is named. Month over month (July) is the default reading for a monthly question; a year-over-year reading is defensible, so pop is a judgement call."

  - id: aug-02
    story: revenue_decline_aug_2026
    speaker: ceo
    register: terse
    question: "August revenue. What happened?"
    split: holdout
    expect:
      metric: revenue
      window: 2026-08
    note: "Neither direction nor baseline is stated."

  - id: aug-03
    story: revenue_decline_aug_2026
    speaker: cfo
    register: formal
    question: "Revenue fell 12% from July to August. Break it down."
    split: dev
    expect:
      metric: revenue
      comparison: pop
      window: 2026-08
      baseline: 2026-07
      premises:
        - {metric: revenue, expectation: down}

  - id: aug-04
    story: revenue_decline_aug_2026
    speaker: sales
    register: casual
    question: "Sales dropped last month. Which region?"
    split: dev
    expect:
      metric: revenue
      window: 2026-08
      breakdown: [region]
      premises:
        - {metric: revenue, expectation: down}
    note: "'Sales' means revenue in the glossary. Baseline unstated; July is the natural reading but is not asserted."

  - id: aug-05
    story: revenue_decline_aug_2026
    speaker: sales
    register: casual
    question: "Which customers pulled back in August?"
    split: holdout
    expect:
      metric: revenue
      window: 2026-08
      breakdown: [customer]
    note: "'Pulled back' implies a decline in what they bought; revenue is the natural measure, orders would also be defensible."

  - id: aug-06
    story: revenue_decline_aug_2026
    speaker: ceo
    register: idiomatic
    question: "What is going on in Dallas? August looked awful."
    split: dev
    expect:
      window: 2026-08
      filters:
        branch: Dallas
    note: "No metric is named. A CEO means sales, but a human would either assume revenue or ask; only the branch filter and month are asserted."

  - id: aug-07
    story: revenue_decline_aug_2026
    speaker: analyst
    register: formal
    question: "Revenue for the Dallas branch, August 2026 vs July 2026."
    split: dev
    expect:
      metric: revenue
      comparison: pop
      window: 2026-08
      baseline: 2026-07
      filters:
        branch: Dallas
      intent: compare

  - id: aug-08
    story: revenue_decline_aug_2026
    speaker: sales
    register: casual
    question: "Trinity Ridge basically stopped ordering in August. How much did that cost us?"
    split: holdout
    expect:
      metric: revenue
      window: 2026-08
      filters:
        customer: Trinity Ridge Construction
      premises:
        - {metric: revenue, expectation: down}
    note: "'Trinity Ridge' is a partial customer name; there is one matching customer. The comparison month is unstated (July is the natural reading)."

  - id: aug-09
    story: revenue_decline_aug_2026
    speaker: cfo
    register: formal
    question: "Month-over-month revenue decline for August 2026: decompose into order count and average order value."
    split: dev
    expect:
      metric: revenue
      comparison: pop
      window: 2026-08
      baseline: 2026-07
      premises:
        - {metric: revenue, expectation: down}

  - id: aug-10
    story: revenue_decline_aug_2026
    speaker: analyst
    register: terse
    question: "Was the August decline orders or AOV?"
    split: dev
    expect:
      metric: revenue
      window: 2026-08
      premises:
        - {metric: revenue, expectation: down}
    note: "The subject is revenue (orders x AOV are its drivers); the decline is taken as given."

  - id: aug-11
    story: revenue_decline_aug_2026
    speaker: sales
    register: idiomatic
    question: "Did the August promo eat our price? ASP by tier, July vs August."
    split: holdout
    expect:
      metric: asp
      comparison: pop
      window: 2026-08
      baseline: 2026-07
      breakdown: [product_tier]

  - id: aug-12
    story: revenue_decline_aug_2026
    speaker: cfo
    register: terse
    question: "Discount rate July vs August 2026."
    split: dev
    expect:
      metric: discount_rate
      comparison: pop
      window: 2026-08
      baseline: 2026-07
      intent: compare
    note: "Order of mention is July then August; the later month is the current side."

  - id: aug-13
    story: revenue_decline_aug_2026
    speaker: ceo
    register: casual
    question: "Is August revenue down versus last year too?"
    split: dev
    expect:
      metric: revenue
      comparison: yoy
      window: 2026-08
      baseline: 2025-08

  - id: aug-14
    story: revenue_decline_aug_2026
    speaker: analyst
    register: terse
    question: "Revenue August 2026 vs August 2025."
