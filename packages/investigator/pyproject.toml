[project]
name = "analystos-investigator"
version = "0.1.0"
requires-python = ">=3.12"
description = "AnalystOS investigation engine: interpretation, planning, execution, evidence and optional LLM orchestration"
dependencies = ["analystos-engine", "pydantic>=2.8"]

[project.optional-dependencies]
llm = ["anthropic>=0.69"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analystos_investigator"]

[tool.uv.sources]
analystos-engine = { workspace = true }
analystos-investigator = { workspace = true }
analystos-demo = { workspace = true }
