[project]
name = "analystos-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["analystos-engine", "numpy>=2", "pandas>=2.2", "pyarrow>=17", "openpyxl>=3.1", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analystos_demo"]

[tool.uv.sources]
analystos-engine = { workspace = true }
analystos-investigator = { workspace = true }
analystos-demo = { workspace = true }
