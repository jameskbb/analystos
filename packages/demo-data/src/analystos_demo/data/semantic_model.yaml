# Summit Supply Co. semantic model (AnalystOS demo).
# Validated against analystos_engine.semantic.models.SemanticModel in packages/demo-data/tests.
name: Summit Supply Co.
version: 1
calendar:
  fiscal_year_start_month: 1
  week_start: monday
  fiscal_year_naming: end_year

entities:
  - name: order_lines
    table: order_lines
    primary_key: order_line_id
    label: Order Lines
    grain_description: One row per product line on a sales order (includes lines of cancelled orders).
    default_time_dimension: order_date
  - name: orders
    table: orders
    primary_key: order_id
    label: Orders
    grain_description: One row per sales order header.
    default_time_dimension: order_date
  - name: customers
    table: customers
    primary_key: customer_id
    label: Customers
    grain_description: One row per customer account (raw file contains a few exact duplicate rows of inactive accounts).
  - name: products
    table: products
    primary_key: product_id
    label: Products
    grain_description: One row per product (SKU).
  - name: regions
    table: regions
    primary_key: region
    label: Regions
    grain_description: One row per sales region (conformed dimension for actuals, leads, budgets and the operating plan).
  - name: customer_segments
    table: customer_segments
    primary_key: segment
    label: Customer Segments
    grain_description: One row per customer segment (conformed dimension for actuals, leads and the operating plan).
  - name: product_categories
    table: product_categories
    primary_key: category
    label: Product Categories
    grain_description: One row per product category (conformed dimension for actuals, category budgets and the operating plan).
  - name: suppliers
    table: suppliers
    primary_key: supplier_id
    label: Suppliers
    grain_description: One row per supplier (clean supplier names; the free-text products.supplier is not used for reporting).
  - name: branches
    table: branches
    primary_key: branch_id
    label: Branches
    grain_description: One row per branch location.
  - name: sales_reps
    table: sales_reps
    primary_key: rep_id
    label: Sales Reps
    grain_description: One row per sales rep.
  - name: returns
    table: returns
    primary_key: return_id
    label: Returns
    grain_description: One row per returned order line (RMA).
    default_time_dimension: return_date
  - name: inventory_snapshots
    table: inventory_snapshots
    primary_key: [snapshot_date, branch_id, product_id]
    label: Inventory Snapshots
    grain_description: Month-end on-hand position per branch and product. Semi-additive over time.
    default_time_dimension: snapshot_date
  - name: leads
    table: leads
    primary_key: lead_id
    label: Leads
    grain_description: One row per inbound or outbound lead, dated by creation.
    default_time_dimension: lead_created_date
  - name: opportunities
    table: opportunities
    primary_key: opportunity_id
    label: Opportunities
    grain_description: One row per sales opportunity created from a lead.
    default_time_dimension: opportunity_created_date
  - name: sales_plan
    table: sales_plan
    primary_key: [plan_month, region, segment, category]
    label: Sales Plan
    grain_description: >-
      FY26 Operating Plan for sales per month, region, customer segment and product category (units, list revenue,
      discounts, revenue, COGS and sales commission).
    default_time_dimension: plan_month
  - name: opex_plan
    table: opex_plan
    primary_key: [plan_month, branch_id]
    label: Operating Expense Plan
    grain_description: FY26 Operating Plan for freight and branch operating expenses per month and branch.
    default_time_dimension: opex_plan_month
  - name: budgets_branch
    table: budgets_branch
    primary_key: [branch_id, budget_month]
    label: Branch Budget
    grain_description: Budget per branch and month (from budgets.xlsx, sheet Branch Budget).
    default_time_dimension: budget_month
  - name: budgets_category
    table: budgets_category
    primary_key: [category, budget_month]
    label: Category Budget
    grain_description: Budget per product category and month (from budgets.xlsx, sheet Category Budget).
    default_time_dimension: category_budget_month
  - name: targets
    table: targets
    primary_key: [target_month, rep_id]
    label: Sales Targets
    grain_description: Monthly revenue target per sales rep.
    default_time_dimension: target_month
  - name: operating_expenses
    table: operating_expenses
    primary_key: [expense_month, branch_id]
    label: Operating Expenses
    grain_description: >-
      Actual branch operating expenses per branch and month (headcount, regular payroll, overtime, occupancy, other). Freight is on
      orders and sales commission on order lines.
    default_time_dimension: expense_month
  - name: product_costs
    table: product_costs
    primary_key: [product_id, cost_month]
    label: Product Costs
    grain_description: Standard unit cost per product and month.
    default_time_dimension: cost_month

relationships:
  - {from_entity: branches, from_col: region, to_entity: regions, to_col: region, cardinality: many_to_one, approved: true}
  - {from_entity: customers, from_col: segment, to_entity: customer_segments, to_col: segment, cardinality: many_to_one, approved: true}
  - {from_entity: products, from_col: category, to_entity: product_categories, to_col: category, cardinality: many_to_one, approved: true}
  - {from_entity: products, from_col: supplier_id, to_entity: suppliers, to_col: supplier_id, cardinality: many_to_one, approved: true,
     notes: "Supplier master key. products.supplier is free text with inconsistent casing and is not used for reporting."}
  - {from_entity: sales_plan, from_col: region, to_entity: regions, to_col: region, cardinality: many_to_one, approved: true}
  - {from_entity: sales_plan, from_col: segment, to_entity: customer_segments, to_col: segment, cardinality: many_to_one, approved: true}
  - {from_entity: sales_plan, from_col: category, to_entity: product_categories, to_col: category, cardinality: many_to_one, approved: true}
  - {from_entity: budgets_category, from_col: category, to_entity: product_categories, to_col: category, cardinality: many_to_one, approved: true}
  - {from_entity: leads, from_col: segment, to_entity: customer_segments, to_col: segment, cardinality: many_to_one, approved: true}
  - {from_entity: order_lines, from_col: order_id, to_entity: orders, to_col: order_id, cardinality: many_to_one, approved: true}
  - {from_entity: order_lines, from_col: product_id, to_entity: products, to_col: product_id, cardinality: many_to_one, approved: true}
  - {from_entity: orders, from_col: customer_id, to_entity: customers, to_col: customer_id, cardinality: many_to_one, approved: true,
     notes: "customers.csv has 8 exact duplicate rows, all inactive accounts without orders; observed fan-out is 1.0"}
  - {from_entity: orders, from_col: branch_id, to_entity: branches, to_col: branch_id, cardinality: many_to_one, approved: true,
     notes: "Fulfilling branch. This is the branch used for regional reporting."}
  - {from_entity: orders, from_col: sales_rep_id, to_entity: sales_reps, to_col: rep_id, cardinality: many_to_one, approved: true}
  - {from_entity: customers, from_col: home_branch_id, to_entity: branches, to_col: branch_id, cardinality: many_to_one, approved: false,
     notes: "Home branch can differ from the fulfilling branch; not approved so revenue is never regionalised through it."}
  - {from_entity: sales_reps, from_col: branch_id, to_entity: branches, to_col: branch_id, cardinality: many_to_one, approved: false,
     notes: "Rep's home branch; orders carry their own fulfilling branch."}
  - {from_entity: returns, from_col: order_id, to_entity: orders, to_col: order_id, cardinality: many_to_one, approved: false,
     notes: "12% of returns.order_id values are whitespace-padded and do not match without trim(); returns carry branch, product and customer directly."}
  - {from_entity: returns, from_col: branch_id, to_entity: branches, to_col: branch_id, cardinality: many_to_one, approved: true}
  - {from_entity: returns, from_col: product_id, to_entity: products, to_col: product_id, cardinality: many_to_one, approved: true}
  - {from_entity: returns, from_col: customer_id, to_entity: customers, to_col: customer_id, cardinality: many_to_one, approved: true}
  - {from_entity: inventory_snapshots, from_col: branch_id, to_entity: branches, to_col: branch_id, cardinality: many_to_one, approved: true}
  - {from_entity: inventory_snapshots, from_col: product_id, to_entity: products, to_col: product_id, cardinality: many_to_one, approved: true}
  - {from_entity: leads, from_col: branch_id, to_entity: branches, to_col: branch_id, cardinality: many_to_one, approved: true}
  - {from_entity: leads, from_col: assigned_rep_id, to_entity: sales_reps, to_col: rep_id, cardinality: many_to_one, approved: true}
  - {from_entity: opportunities, from_col: lead_id, to_entity: leads, to_col: lead_id, cardinality: many_to_one, approved: true}
  - {from_entity: budgets_branch, from_col: branch_id, to_entity: branches, to_col: branch_id, cardinality: many_to_one, approved: true}
  - {from_entity: targets, from_col: rep_id, to_entity: sales_reps, to_col: rep_id, cardinality: many_to_one, approved: true}
  - {from_entity: targets, from_col: branch_id, to_entity: branches, to_col: branch_id, cardinality: many_to_one, approved: true}
  - {from_entity: operating_expenses, from_col: branch_id, to_entity: branches, to_col: branch_id, cardinality: many_to_one, approved: true}
  - {from_entity: opex_plan, from_col: branch_id, to_entity: branches, to_col: branch_id, cardinality: many_to_one, approved: true}
  - {from_entity: product_costs, from_col: product_id, to_entity: products, to_col: product_id, cardinality: many_to_one, approved: true}

dimensions:
  # Orders
  - {name: order_date, entity: orders, expr: order_date, type: time, label: Order Date, synonyms: [date, order day]}
  - {name: ship_date, entity: orders, expr: ship_date, type: time, label: Ship Date}
  - {name: order_status, entity: orders, expr: status, label: Order Status, synonyms: [status]}
  - {name: channel, entity: orders, expr: channel, label: Sales Channel, synonyms: [order channel]}
  # Order lines
  - {name: line_status, entity: order_lines, expr: line_status, label: Line Status}
  # Branches (canonical geography)
  - {name: branch, entity: branches, expr: branch_name, label: Branch, synonyms: [store, location, city]}
  - {name: region, entity: regions, expr: region, label: Region, synonyms: [territory, area, sales region]}
  - {name: state, entity: branches, expr: state, label: State}
  - {name: branch_opened_date, entity: branches, expr: opened_date, type: time, label: Branch Opened Date}
  # Customers
  - {name: customer, entity: customers, expr: customer_name, label: Customer, synonyms: [account, customer name]}
  - {name: segment, entity: customer_segments, expr: segment, label: Customer Segment, synonyms: [customer segment, customer type]}
  - {name: payment_terms, entity: customers, expr: payment_terms, label: Payment Terms}
  # Products
  - {name: product, entity: products, expr: product_name, label: Product, synonyms: [item, sku name]}
  - {name: sku, entity: products, expr: sku, label: SKU}
  - {name: category, entity: product_categories, expr: category, label: Product Category, synonyms: [product category, product line]}
  - {name: subcategory, entity: products, expr: subcategory, label: Subcategory}
  - {name: product_tier, entity: products, expr: tier, label: Product Tier, synonyms: [tier, price tier, good better best]}
  - {name: product_launch_date, entity: products, expr: launch_date, type: time, label: Product Launch Date}
  - {name: supplier, entity: suppliers, expr: supplier_name, label: Supplier, synonyms: [vendor, supplier name, mill]}
  # Sales reps
  - {name: sales_rep, entity: sales_reps, expr: rep_name, label: Sales Rep, synonyms: [salesperson, rep, account manager]}
  # Returns
  - {name: return_date, entity: returns, expr: return_date, type: time, label: Return Date}
  - {name: return_reason, entity: returns, expr: reason, label: Return Reason}
  # Inventory
  - {name: snapshot_date, entity: inventory_snapshots, expr: snapshot_date, type: time, label: Snapshot Date, synonyms: [inventory date]}
  # Leads and opportunities
  - {name: lead_created_date, entity: leads, expr: created_date, type: time, label: Lead Created Date}
  - {name: lead_channel, entity: leads, expr: channel, label: Lead Channel, synonyms: [lead source, marketing channel, source]}
  - {name: lead_status, entity: leads, expr: status, label: Lead Status}
  - {name: opportunity_created_date, entity: opportunities, expr: created_date, type: time, label: Opportunity Created Date}
  - {name: opportunity_close_date, entity: opportunities, expr: close_date, type: time, label: Opportunity Close Date}
  - {name: opportunity_stage, entity: opportunities, expr: stage, label: Opportunity Stage, synonyms: [stage]}
  # Plans
  - {name: plan_month, entity: sales_plan, expr: plan_month, type: time, label: Plan Month}
  - {name: plan_version, entity: sales_plan, expr: plan_version, label: Plan Version}
  - {name: opex_plan_month, entity: opex_plan, expr: plan_month, type: time, label: Opex Plan Month}
  - {name: budget_month, entity: budgets_branch, expr: budget_month, type: time, label: Budget Month}
  - {name: category_budget_month, entity: budgets_category, expr: budget_month, type: time, label: Category Budget Month}
  - {name: budget_category, entity: budgets_category, expr: category, label: Budget Category}
  - {name: target_month, entity: targets, expr: target_month, type: time, label: Target Month}
  - {name: expense_month, entity: operating_expenses, expr: expense_month, type: time, label: Expense Month}
  - {name: cost_month, entity: product_costs, expr: cost_month, type: time, label: Cost Month}

metrics:
  # ----- Sales ---------------------------------------------------------------------------
  - id: revenue
    name: Revenue
    label: Revenue
    description: Net revenue after line discounts. Excludes cancelled orders. Dated by order date. Negative lines (returns keyed as orders) are included, as booked.
    kind: simple
    entity: order_lines
    expr: net_amount
    agg: sum
    filters: [{dimension: order_status, op: neq, values: [cancelled]}]
    format: currency
    owner: FP&A
    tags: [sales, finance, core]
    synonyms: [net revenue, sales, net sales, revenue net]
    default_time_dimension: order_date
    related_metrics: [conversion_rate]
  - id: gross_revenue
    name: Gross Revenue
    label: Gross Revenue
    description: Revenue at list price (quantity x unit list price) before discounts. Excludes cancelled orders.
    kind: simple
    entity: order_lines
    expr: gross_amount
    agg: sum
    filters: [{dimension: order_status, op: neq, values: [cancelled]}]
    format: currency
    owner: FP&A
    tags: [sales, pricing]
    synonyms: [gross sales, list revenue, revenue at list]
    default_time_dimension: order_date
  - id: discount_amount
    name: Discounts
    label: Discounts
    description: Discount dollars given off list price. Excludes cancelled orders.
    kind: simple
    entity: order_lines
    expr: discount_amount
    agg: sum
    filters: [{dimension: order_status, op: neq, values: [cancelled]}]
    format: currency
    owner: Pricing
    tags: [pricing]
    synonyms: [discount dollars, discounts given]
    default_time_dimension: order_date
    higher_is_better: false
  - id: discount_rate
    name: Discount Rate
    label: Discount Rate
    description: Discount dollars as a share of gross (list) revenue. Ratio of sums.
    kind: ratio
    numerator: discount_amount
    denominator: gross_revenue
    format: percent
    owner: Pricing
    tags: [pricing]
    synonyms: [discount %, discount percent, average discount]
    higher_is_better: false
    default_time_dimension: order_date
  - id: orders
    name: Orders
    label: Orders
    description: Count of distinct non-cancelled orders with at least one line. Not additive across product dimensions (an order spanning two categories counts in both).
    kind: simple
    entity: order_lines
    expr: order_id
    agg: count_distinct
    filters: [{dimension: order_status, op: neq, values: [cancelled]}]
    format: integer
    owner: Sales Ops
    tags: [sales, volume, core]
    synonyms: [order count, number of orders, order volume, transactions]
    default_time_dimension: order_date
  - id: units
    name: Units
    label: Units Sold
    description: Quantity sold in selling units of measure. Excludes cancelled orders.
    kind: simple
    entity: order_lines
    expr: quantity
    agg: sum
    filters: [{dimension: order_status, op: neq, values: [cancelled]}]
    format: integer
    owner: Sales Ops
    tags: [sales, volume]
    synonyms: [units sold, quantity, unit volume, units shipped]
    default_time_dimension: order_date
  - id: units_per_order
    name: Units per Order
    label: Units per Order
    description: Average units on a non-cancelled order (basket size in units).
    kind: derived
    formula: units / orders
    format: number
    owner: Sales Ops
    tags: [sales, volume]
    synonyms: [basket size, units per transaction]
    default_time_dimension: order_date
  - id: aov
    name: Average Order Value
    label: AOV
    description: Revenue per order (ratio of sums).
    kind: ratio
    numerator: revenue
    denominator: orders
    format: currency
    owner: Sales Ops
    tags: [sales, price]
    synonyms: [AOV, order value, average order size]
    default_time_dimension: order_date
  - id: asp
    name: Average Selling Price
    label: ASP
    description: Revenue per unit sold (ratio of sums). Sensitive to product and tier mix.
    kind: ratio
    numerator: revenue
    denominator: units
    format: currency
    owner: Pricing
    tags: [pricing, price]
    synonyms: [ASP, average price, price per unit, selling price]
    default_time_dimension: order_date
  - id: active_customers
    name: Active Customers
    label: Active Customers
    description: Distinct customers with at least one non-cancelled order in the period.
    kind: simple
    entity: orders
    expr: customer_id
    agg: count_distinct
    filters: [{dimension: order_status, op: neq, values: [cancelled]}]
    format: integer
    owner: Sales Ops
    tags: [customers]
    synonyms: [buying customers, customer count, number of customers]
    default_time_dimension: order_date
  - id: orders_per_customer
    name: Orders per Customer
    label: Orders per Customer
    description: Purchase frequency, orders divided by active customers.
    kind: derived
    formula: orders / active_customers
    format: number
    owner: Sales Ops
    tags: [customers]
    synonyms: [purchase frequency, order frequency]
    default_time_dimension: order_date
  - id: cogs
    name: COGS
    label: COGS
    description: Cost of goods sold at the unit cost in effect in the order month. Excludes cancelled orders.
    kind: simple
    entity: order_lines
    expr: cost_amount
    agg: sum
    filters: [{dimension: order_status, op: neq, values: [cancelled]}]
    format: currency
    owner: FP&A
    tags: [finance, cost]
    synonyms: [cost of goods sold, cost of sales, product cost]
    default_time_dimension: order_date
    higher_is_better: false
  - id: standard_unit_cost
    name: Standard Unit Cost
    label: Standard Unit Cost
    description: >-
      Average recorded standard unit cost per product and month (product_costs), not weighted by sales.
      Tests input-cost changes independently of what was sold.
    kind: simple
    entity: product_costs
    expr: unit_cost
    agg: avg
    format: currency
    owner: Finance
    tags: [cost, unit_cost]
    synonyms: [standard cost, recorded unit cost, supplier cost]
    default_time_dimension: cost_month
    higher_is_better: false
  - id: gross_margin
    name: Gross Margin
    label: Gross Margin
    description: Revenue minus COGS, in dollars.
    kind: derived
    formula: revenue - cogs
    format: currency
    owner: FP&A
    tags: [finance, margin, core]
    synonyms: [gross profit, GM dollars, gross margin dollars]
    default_time_dimension: order_date
  - id: gross_margin_pct
    name: Gross Margin %
    label: Gross Margin %
    description: Gross margin as a share of revenue (ratio of sums, never an average of line margins).
    kind: ratio
    numerator: gross_margin
    denominator: revenue
    format: percent
    owner: FP&A
    tags: [finance, margin, core]
    synonyms: [gross margin percent, gross margin percentage, GM%, gross margin rate, margin %]
    default_time_dimension: order_date
  - id: freight_cost
    name: Freight Cost
    label: Freight Cost
    description: >-
      All outbound delivery cost per order, own fleet and carriers (zero for counter pickup): base freight plus the
      carrier fuel surcharge. Excludes cancelled orders.
    kind: simple
    entity: orders
    expr: freight_cost
    agg: sum
    filters: [{dimension: order_status, op: neq, values: [cancelled]}]
    format: currency
    owner: Operations
    tags: [finance, cost]
    synonyms: [freight, delivery cost, shipping cost]
    default_time_dimension: order_date
    higher_is_better: false
  - id: base_freight
    name: Base Freight
    label: Base Freight
    description: Freight before the carrier fuel surcharge (delivery rates x delivered orders). Excludes cancelled orders.
    kind: simple
    entity: orders
    expr: base_freight
    agg: sum
    filters: [{dimension: order_status, op: neq, values: [cancelled]}]
    format: currency
    owner: Operations
    tags: [finance, cost, freight]
    synonyms: [freight before surcharge, delivery rates]
    default_time_dimension: order_date
    higher_is_better: false
  - id: fuel_surcharge
    name: Fuel Surcharge
    label: Fuel Surcharge
    description: Carrier fuel surcharge billed on deliveries, part of freight. Excludes cancelled orders.
    kind: simple
    entity: orders
    expr: fuel_surcharge
    agg: sum
    filters: [{dimension: order_status, op: neq, values: [cancelled]}]
    format: currency
    owner: Operations
    tags: [finance, cost, freight]
    synonyms: [fuel surcharges, carrier fuel surcharge, diesel surcharge]
    default_time_dimension: order_date
    higher_is_better: false
  - id: deliveries
    name: Deliveries
    label: Deliveries
    description: Delivered orders (every non-cancelled order except counter pickup). The volume that drives base freight.
    kind: simple
    entity: orders
    expr: order_id
    agg: count_distinct
    filters: [{dimension: order_status, op: neq, values: [cancelled]}, {dimension: channel, op: neq, values: [Counter]}]
    format: integer
    owner: Operations
    tags: [operations, freight]
    synonyms: [delivery volume, delivered orders, shipments]
    default_time_dimension: order_date
  - id: sales_commission
    name: Sales Commission
    label: Sales Commission
    description: Rep commission on net revenue. Excludes cancelled orders.
    kind: simple
    entity: order_lines
    expr: commission_amount
    agg: sum
    filters: [{dimension: order_status, op: neq, values: [cancelled]}]
    format: currency
    owner: Sales Ops
    tags: [finance, cost]
    synonyms: [commissions]
    default_time_dimension: order_date
    higher_is_better: false
  - id: contribution_margin
    name: Contribution Margin
    label: Contribution Margin
    description: Gross margin less variable selling costs (freight and commission).
    kind: derived
    formula: revenue - cogs - freight_cost - sales_commission
    format: currency
    owner: FP&A
    tags: [finance, margin]
    synonyms: [contribution, CM dollars]
    default_time_dimension: order_date
  - id: contribution_margin_pct
    name: Contribution Margin %
    label: Contribution Margin %
    description: Contribution margin as a share of revenue.
    kind: ratio
    numerator: contribution_margin
    denominator: revenue
    format: percent
    owner: FP&A
    tags: [finance, margin]
    synonyms: [CM%, contribution margin percent]
    default_time_dimension: order_date
  - id: payroll
    name: Payroll
    label: Payroll
    description: Regular (straight-time) branch payroll, dated by expense month. Overtime is a separate line.
    kind: simple
    entity: operating_expenses
    expr: payroll
    agg: sum
    format: currency
    owner: FP&A
    tags: [finance, cost, opex]
    synonyms: [regular payroll, wages, salaries]
    default_time_dimension: expense_month
    higher_is_better: false
  - id: overtime
    name: Overtime
    label: Overtime
    description: Branch overtime pay, dated by expense month.
    kind: simple
    entity: operating_expenses
    expr: overtime
    agg: sum
    format: currency
    owner: FP&A
    tags: [finance, cost, opex]
    synonyms: [overtime pay, OT]
    default_time_dimension: expense_month
    higher_is_better: false
  - id: occupancy
    name: Occupancy
    label: Occupancy
    description: Branch rent, property costs and utilities, dated by expense month.
    kind: simple
    entity: operating_expenses
    expr: occupancy
    agg: sum
    format: currency
    owner: FP&A
    tags: [finance, cost, opex]
    synonyms: [rent, facilities]
    default_time_dimension: expense_month
    higher_is_better: false
  - id: other_opex
    name: Other Operating Expenses
    label: Other Operating Expenses
    description: Other branch operating costs (IT, supplies, maintenance, travel), dated by expense month.
    kind: simple
    entity: operating_expenses
    expr: other_opex
    agg: sum
    format: currency
    owner: FP&A
    tags: [finance, cost, opex]
    synonyms: [other opex, other expenses]
    default_time_dimension: expense_month
    higher_is_better: false
  - id: labor_cost
    name: Labor Cost
    label: Labor Cost
    description: Branch labor, regular payroll plus overtime, dated by expense month.
    kind: derived
    formula: payroll + overtime
    format: currency
    owner: FP&A
    tags: [finance, cost, opex]
    synonyms: [labor, labour cost, staff cost, wages and overtime]
    default_time_dimension: expense_month
    higher_is_better: false
  - id: headcount
    name: Headcount
    label: Headcount (FTE)
    description: >-
      Full-time equivalent employees on branch payroll. A monthly level: over a period it is the average of the
      monthly totals, never their sum.
    kind: simple
    entity: operating_expenses
    expr: headcount
    agg: sum
    time_aggregation: avg
    format: number
    unit: FTE
    owner: FP&A
    tags: [operations, labor]
    synonyms: [FTE, staffing, employees, head count]
    default_time_dimension: expense_month
  - id: operating_expenses
    name: Operating Expenses
    label: Operating Expenses
    description: >-
      All operating expenses: freight, sales commission, regular payroll, overtime, occupancy and other branch costs.
      Combine at month or coarser grain (branch expenses are monthly).
    kind: derived
    formula: freight_cost + labor_cost + sales_commission + occupancy + other_opex
    format: currency
    owner: FP&A
    tags: [finance, cost, opex]
    synonyms: [opex, operating costs, expenses]
    default_time_dimension: order_date
    higher_is_better: false
  - id: operating_profit
    name: Operating Profit
    label: Operating Profit
    description: >-
      Gross margin less operating expenses (freight, commission and branch operating costs). Combine at month or
      coarser grain (branch expenses are monthly).
    kind: derived
    formula: gross_margin - operating_expenses
    format: currency
    owner: FP&A
    tags: [finance, profit, core]
    synonyms: [operating income, EBIT proxy, branch profit]
    default_time_dimension: order_date
  - id: operating_margin_pct
    name: Operating Margin %
    label: Operating Margin %
    description: Operating profit as a share of revenue.
    kind: ratio
    numerator: operating_profit
    denominator: revenue
    format: percent
    owner: FP&A
    tags: [finance, profit]
    synonyms: [operating margin percent, OP%, operating profit margin]
    default_time_dimension: order_date
  - id: cost_to_list_ratio
    name: Cost to List Ratio
    label: COGS per List Dollar
    description: >-
      COGS as a share of gross (list-price) revenue: what a dollar of list-price sales costs. Moves with unit costs
      when list prices are unchanged; unlike cost per unit it does not move with product mix inside a category.
    kind: ratio
    numerator: cogs
    denominator: gross_revenue
    format: percent
    owner: FP&A
    tags: [finance, cost, unit_cost]
    synonyms: [cost per list dollar, cost ratio, standard cost ratio]
    default_time_dimension: order_date
    higher_is_better: false
  # ----- Returns -------------------------------------------------------------------------
  - id: returns_amount
    name: Returns
    label: Returned Revenue
    description: Net value of returned goods, dated by return date.
    kind: simple
    entity: returns
    expr: return_amount
    agg: sum
    format: currency
    owner: Operations
    tags: [returns]
    synonyms: [returned revenue, return value, returns value]
    default_time_dimension: return_date
    higher_is_better: false
  - id: return_rate
    name: Return Rate
    label: Return Rate
    description: Returned revenue as a share of revenue in the same period (returns dated by return date, revenue by order date).
    kind: ratio
    numerator: returns_amount
    denominator: revenue
    format: percent
    owner: Operations
    tags: [returns]
    synonyms: [returns rate, return %]
    higher_is_better: false
    default_time_dimension: order_date
  # ----- Pipeline ------------------------------------------------------------------------
  - id: leads
    name: Leads
    label: Leads
    description: Count of leads created in the period.
    kind: simple
    entity: leads
    expr: lead_id
    agg: count
    format: integer
    owner: Marketing
    tags: [pipeline, core]
    synonyms: [lead volume, lead count, number of leads]
    default_time_dimension: lead_created_date
  - id: converted_leads
    name: Converted Leads
    label: Converted Leads
    description: Leads that became customers (status Converted), counted in the lead's creation period.
    kind: simple
    entity: leads
    expr: is_converted
    agg: sum
    format: integer
    owner: Marketing
    tags: [pipeline]
    synonyms: [conversions, won leads]
    default_time_dimension: lead_created_date
    maturity_days: 90
  - id: conversion_rate
    name: Conversion Rate
    label: Conversion Rate
    description: Converted leads divided by leads, by lead creation cohort. Recent cohorts are immature (conversion lag up to ~110 days).
    kind: ratio
    numerator: converted_leads
    denominator: leads
    format: percent
    owner: Marketing
    tags: [pipeline, core]
    synonyms: [lead conversion, lead conversion rate, conversion, win rate, converting, funnel]
    default_time_dimension: lead_created_date
    related_metrics: [median_first_response_hours]
  - id: median_first_response_hours
    name: Median First Response Time
    label: Median First Response (hours)
    description: Median hours from lead creation to the first sales response, by lead creation cohort.
    kind: simple
    entity: leads
    expr: first_response_hours
    agg: median
    format: number
    unit: hours
    owner: Marketing
    tags: [pipeline, responsiveness]
    synonyms: [first response time, response time, speed to lead, lead response time]
    default_time_dimension: lead_created_date
    higher_is_better: false
  - id: pipeline_amount
    name: Pipeline Amount
    label: Pipeline Amount
    description: Estimated annual value of opportunities, dated by opportunity creation.
    kind: simple
    entity: opportunities
    expr: amount
    agg: sum
    format: currency
    owner: Sales Ops
    tags: [pipeline]
    synonyms: [pipeline, opportunity value]
    default_time_dimension: opportunity_created_date
  # ----- Inventory -----------------------------------------------------------------------
  - id: inventory_value
    name: Inventory Value
    label: Inventory Value
    description: On-hand inventory at cost at a month-end snapshot. Semi-additive, compare single snapshot dates and never sum across months.
    kind: simple
    entity: inventory_snapshots
    expr: inventory_value
    agg: sum
    format: currency
    owner: Operations
    tags: [inventory, semi_additive, core]
    synonyms: [inventory, stock value, on-hand value, inventory at cost]
    default_time_dimension: snapshot_date
    time_aggregation: last
    higher_is_better: false
  - id: on_hand_units
    name: On-Hand Units
    label: On-Hand Units
    description: Units on hand at a month-end snapshot. Semi-additive.
    kind: simple
    entity: inventory_snapshots
    expr: on_hand_units
    agg: sum
    format: integer
    owner: Operations
    tags: [inventory, semi_additive]
    synonyms: [stock units, units on hand]
    default_time_dimension: snapshot_date
    time_aggregation: last
  - id: daily_usage_value
    name: Daily Usage at Cost
    label: Daily Usage at Cost
    description: Trailing 90-day units sold valued at current unit cost, per day.
    kind: simple
    entity: inventory_snapshots
    expr: units_sold_90d * unit_cost / 90.0
    agg: sum
    format: currency
    owner: Operations
    tags: [inventory]
    synonyms: [daily usage, run rate]
    default_time_dimension: snapshot_date
    time_aggregation: last
  - id: days_of_supply
    name: Days of Supply
    label: Days of Supply
    description: Inventory value divided by daily usage at cost (trailing 90 days). Null when nothing sold in 90 days.
    kind: ratio
    numerator: inventory_value
    denominator: daily_usage_value
    format: number
    owner: Operations
    tags: [inventory, core]
    synonyms: [DOS, days of inventory, days on hand, inventory days]
    higher_is_better: false
    default_time_dimension: snapshot_date
  # ----- Plan: the FY26 Operating Plan (sales_plan, opex_plan), budgets and targets --------
  # Every plan metric names the actual it plans (plan_for), so plan variances decompose
  # through the same governed metric tree as actual changes.
  - id: plan_revenue
    name: Revenue Plan
    label: Revenue Plan
    description: FY26 Operating Plan net revenue (list revenue less planned discounts).
    kind: simple
    entity: sales_plan
    expr: plan_revenue
    agg: sum
    format: currency
    owner: FP&A
    tags: [plan]
    plan_for: revenue
    default_time_dimension: plan_month
  - id: plan_gross_revenue
    name: Gross Revenue Plan
    label: Gross Revenue Plan
    description: FY26 Operating Plan revenue at list price.
    kind: simple
    entity: sales_plan
    expr: plan_gross_revenue
    agg: sum
    format: currency
    owner: FP&A
    tags: [plan]
    plan_for: gross_revenue
    default_time_dimension: plan_month
  - id: plan_discount_amount
    name: Discounts Plan
    label: Discounts Plan
    description: FY26 Operating Plan discount dollars (prior-year discount rate per region, segment and category).
    kind: simple
    entity: sales_plan
    expr: plan_discount_amount
    agg: sum
    format: currency
    owner: FP&A
    tags: [plan]
    plan_for: discount_amount
    default_time_dimension: plan_month
    higher_is_better: false
  - id: plan_units
    name: Units Plan
    label: Units Plan
    description: FY26 Operating Plan units.
    kind: simple
    entity: sales_plan
    expr: plan_units
    agg: sum
    format: integer
    owner: FP&A
    tags: [plan]
    plan_for: units
    default_time_dimension: plan_month
  - id: plan_cogs
    name: COGS Plan
    label: COGS Plan
    description: FY26 Operating Plan cost of goods sold (prior-year unit cost plus planned inflation).
    kind: simple
    entity: sales_plan
    expr: plan_cogs
    agg: sum
    format: currency
    owner: FP&A
    tags: [plan]
    plan_for: cogs
    default_time_dimension: plan_month
    higher_is_better: false
  - id: plan_gross_margin
    name: Gross Margin Plan
    label: Gross Margin Plan
    description: FY26 Operating Plan gross margin.
    kind: derived
    formula: plan_revenue - plan_cogs
    format: currency
    owner: FP&A
    tags: [plan]
    plan_for: gross_margin
    default_time_dimension: plan_month
  - id: plan_gross_margin_pct
    name: Gross Margin % Plan
    label: Gross Margin % Plan
    description: FY26 Operating Plan gross margin as a share of plan revenue.
    kind: ratio
    numerator: plan_gross_margin
    denominator: plan_revenue
    format: percent
    owner: FP&A
    tags: [plan]
    plan_for: gross_margin_pct
    default_time_dimension: plan_month
  - id: plan_discount_rate
    name: Discount Rate Plan
    label: Discount Rate Plan
    description: FY26 Operating Plan discount dollars as a share of plan list revenue.
    kind: ratio
    numerator: plan_discount_amount
    denominator: plan_gross_revenue
    format: percent
    owner: FP&A
    tags: [plan]
    plan_for: discount_rate
    default_time_dimension: plan_month
    higher_is_better: false
  - id: plan_cost_to_list_ratio
    name: Cost to List Ratio Plan
    label: Cost to List Ratio Plan
    description: FY26 Operating Plan COGS as a share of plan list revenue.
    kind: ratio
    numerator: plan_cogs
    denominator: plan_gross_revenue
    format: percent
    owner: FP&A
    tags: [plan]
    plan_for: cost_to_list_ratio
    default_time_dimension: plan_month
    higher_is_better: false
  - id: plan_sales_commission
    name: Sales Commission Plan
    label: Sales Commission Plan
    description: FY26 Operating Plan sales commission (prior-year commission rate).
    kind: simple
