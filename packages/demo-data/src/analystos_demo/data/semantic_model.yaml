    owner: FP&A
    tags: [plan]
    plan_for: operating_profit
    default_time_dimension: plan_month
  - id: plan_operating_margin_pct
    name: Operating Margin % Plan
    label: Operating Margin % Plan
    description: FY26 Operating Plan operating profit as a share of plan revenue.
    kind: ratio
    numerator: plan_operating_profit
    denominator: plan_revenue
    format: percent
    owner: FP&A
    tags: [plan]
    plan_for: operating_margin_pct
    default_time_dimension: plan_month
  - id: budget_revenue
    name: Budget Revenue
    label: Budget Revenue
    description: Branch revenue budget from the FP&A workbook. FY26 rows are the branch allocation of the FY26 Operating Plan.
    kind: simple
    entity: budgets_branch
    expr: revenue_budget
    agg: sum
    format: currency
    owner: FP&A
    tags: [budget]
    plan_for: revenue
    synonyms: [budget, revenue budget]
