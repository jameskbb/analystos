      so for FY26 the revenue target equals plan revenue.
    kind: simple
    entity: targets
    expr: revenue_target
    agg: sum
    format: currency
    owner: Sales Ops
    tags: [target, targets]
    plan_for: revenue
    synonyms: [target, quota, sales target, sales quota]
    default_time_dimension: target_month

metric_trees:
  - root_metric: revenue
    name: "Revenue = Orders x AOV"
    description: >-
      Volume (orders) times order value. Orders split into active customers x purchase frequency;
      AOV splits into units per order x average selling price (price, discount and mix).
    nodes:
      - {parent: revenue, child: orders, relation: multiplicative}
      - {parent: revenue, child: aov, relation: multiplicative}
      - {parent: orders, child: active_customers, relation: multiplicative}
      - {parent: orders, child: orders_per_customer, relation: multiplicative}
      - {parent: aov, child: units_per_order, relation: multiplicative}
      - {parent: aov, child: asp, relation: multiplicative}
  - root_metric: gross_revenue
    name: "Gross Revenue = Revenue + Discounts"
    description: List-price revenue is what was invoiced plus the discounts given (a price view of Revenue).
    nodes:
      - {parent: gross_revenue, child: revenue, relation: additive}
      - {parent: gross_revenue, child: discount_amount, relation: additive}
  - root_metric: gross_margin
    name: "Gross Margin = Revenue - COGS"
    nodes:
      - {parent: gross_margin, child: revenue, relation: additive}
      - {parent: gross_margin, child: cogs, relation: subtractive}
  - root_metric: gross_margin_pct
    name: "Gross Margin % = Gross Margin / Revenue"
    nodes:
      - {parent: gross_margin_pct, child: gross_margin, relation: ratio_numerator}
      - {parent: gross_margin_pct, child: revenue, relation: ratio_denominator}
      - {parent: gross_margin, child: revenue, relation: additive}
      - {parent: gross_margin, child: cogs, relation: subtractive}
  - root_metric: contribution_margin
    name: "Contribution Margin = Gross Margin - Freight - Commission"
    nodes:
      - {parent: contribution_margin, child: gross_margin, relation: additive}
      - {parent: contribution_margin, child: freight_cost, relation: subtractive}
      - {parent: contribution_margin, child: sales_commission, relation: subtractive}
  - root_metric: operating_profit
    name: "Operating Profit = Gross Margin - Operating Expenses"
    description: >-
      Gross margin splits into revenue less COGS; operating expenses into freight (base freight plus fuel surcharge),
      labor (regular payroll plus overtime), sales commission, occupancy and other branch costs. Every node has a plan metric (plan_for), so a variance against the
      FY26 Operating Plan decomposes through the same identities.
    nodes:
      - {parent: operating_profit, child: gross_margin, relation: additive}
      - {parent: operating_profit, child: operating_expenses, relation: subtractive}
      - {parent: gross_margin, child: revenue, relation: additive}
      - {parent: gross_margin, child: cogs, relation: subtractive}
      - {parent: operating_expenses, child: freight_cost, relation: additive}
      - {parent: operating_expenses, child: labor_cost, relation: additive}
      - {parent: operating_expenses, child: sales_commission, relation: additive}
      - {parent: operating_expenses, child: occupancy, relation: additive}
      - {parent: operating_expenses, child: other_opex, relation: additive}
      - {parent: freight_cost, child: base_freight, relation: additive}
      - {parent: freight_cost, child: fuel_surcharge, relation: additive}
      - {parent: labor_cost, child: payroll, relation: additive}
      - {parent: labor_cost, child: overtime, relation: additive}
  - root_metric: conversion_rate
    name: "Conversion Rate = Converted Leads / Leads"
    nodes:
      - {parent: conversion_rate, child: converted_leads, relation: ratio_numerator}
      - {parent: conversion_rate, child: leads, relation: ratio_denominator}
  - root_metric: discount_rate
    name: "Discount Rate = Discounts / Gross Revenue"
    nodes:
      - {parent: discount_rate, child: discount_amount, relation: ratio_numerator}
      - {parent: discount_rate, child: gross_revenue, relation: ratio_denominator}
  - root_metric: days_of_supply
    name: "Days of Supply = Inventory Value / Daily Usage"
    nodes:
      - {parent: days_of_supply, child: inventory_value, relation: ratio_numerator}
      - {parent: days_of_supply, child: daily_usage_value, relation: ratio_denominator}

glossary:
  - term: Margin
    definition: >-
      Ambiguous at Summit Supply. Finance uses four margin measures: Gross Margin (revenue - COGS),
      Gross Margin % (gross margin / revenue), Contribution Margin (gross margin - freight - commission)
      and Operating Profit, the operating margin in dollars (gross margin - all operating expenses).
      Ask which one is meant.
    candidate_metric_ids: [gross_margin, gross_margin_pct, contribution_margin, operating_profit]
    related: [Gross Margin, Contribution Margin, Operating Profit]
    synonyms: [margins, profit margin, profitability]
  - term: Revenue
    definition: >-
      Net revenue: what customers are invoiced after line discounts, on non-cancelled orders, dated by
      order date. "Sales" means Revenue. Gross Revenue is the list-price figure before discounts.
    formula: SUM(order_lines.net_amount) WHERE orders.status <> 'cancelled'
    metric_id: revenue
    related: [Gross Revenue, Discount Rate, Cancelled Order]
    synonyms: [sales, net sales, top line]
  - term: Gross Revenue
    definition: Revenue at list price before discounts; used to measure discounting.
    formula: SUM(quantity x unit_list_price)
    metric_id: gross_revenue
    related: [Revenue, Discount Rate]
  - term: Cancelled Order
    definition: >-
      An order with status 'cancelled'. Its lines stay in order_lines for audit, but every sales metric
      excludes it through the metric filter order_status <> cancelled.
    related: [Revenue, Orders]
    synonyms: [cancellation, cancelled]
  - term: AOV
    definition: Average order value, revenue divided by orders.
    formula: Revenue / Orders
    metric_id: aov
    related: [Revenue, Orders, ASP]
    synonyms: [average order value]
  - term: ASP
    definition: Average selling price per unit, revenue divided by units. Moves with price, discounting and product mix.
    formula: Revenue / Units
    metric_id: asp
    related: [Revenue, Units, Product Tier, Discount Rate]
    synonyms: [average selling price]
  - term: Discount Rate
    definition: Discount dollars as a share of gross revenue.
    formula: Discounts / Gross Revenue
    metric_id: discount_rate
    related: [Gross Revenue, Revenue]
    synonyms: [discounting, promotions, promo depth]
  - term: Product Tier
    definition: Good/better/best positioning of a product. Entry (ValueBuild), Standard (ProLine) and Premium (Summit Select). Entry carries lower prices and lower margins.
    related: [ASP, Gross Margin %]
    synonyms: [tier, entry-level, entry level, premium]
  - term: Region
    definition: Sales region of the fulfilling branch (North Texas, Gulf Coast, Central Texas, West Texas, Oklahoma). Customer billing region in customers.csv is not used for reporting.
    related: [Branch]
    synonyms: [territory]
  - term: Active Customer
    definition: A customer with at least one non-cancelled order in the period.
    metric_id: active_customers
    related: [Revenue, Orders per Customer]
  - term: Conversion Rate
    definition: Share of leads created in a period that became customers. Cohort-based on lead creation date.
    formula: Converted Leads / Leads
    metric_id: conversion_rate
    related: [Leads, Lead Channel]
    synonyms: [conversion, lead conversion]
  - term: Days of Supply
    definition: How many days current inventory would last at the trailing 90-day sales rate, at cost.
    formula: Inventory Value / (90-day usage at cost / 90)
    metric_id: days_of_supply
    related: [Inventory Value, Slow-Moving SKU]
    synonyms: [DOS, days on hand, gathering dust, not moving, sitting on the shelf]
  - term: Slow-Moving SKU
    definition: A product with more than 180 days of supply at a snapshot date, or no sales in the trailing 90 days while stocked.
    related: [Days of Supply, Inventory Value]
    synonyms: [slow mover, dead stock, aged inventory]
  - term: Inventory Value
    definition: On-hand units x unit cost at a month-end snapshot. A balance, not a flow; never sum across months.
    metric_id: inventory_value
    related: [Days of Supply]
    synonyms: [inventory, stock, cash tied up, tied up, cash tied up in inventory, cash tied up in stock]
  - term: Operating Plan
    definition: >-
      The FY26 Operating Plan, approved by the board in December 2025: the one plan for FY26. It plans sales by month,
      region, customer segment and product category (sales_plan) and freight and branch operating expenses by month
      and branch (opex_plan). Method: prior-year actual per cell x volume growth by segment, list prices +1.5%, unit
      costs +2%, prior-year discount and commission rates; opex lines prior-year x planned increases. Branch budgets
      and rep revenue targets for FY26 are allocations of this plan.
    metric_id: plan_operating_profit
    related: [Operating Profit, Budget, Revenue Target]
    synonyms: [plan, FY26 plan, annual operating plan, AOP, operating budget]
  - term: Operating Profit
    definition: >-
      Gross margin less all operating expenses (freight, sales commission, regular payroll, overtime, occupancy and
      other branch costs). Summit's bottom line before corporate overhead, interest and tax.
    formula: Gross Margin - Operating Expenses
    metric_id: operating_profit
    related: [Gross Margin, Operating Expenses, Operating Plan]
    synonyms: [operating income, EBIT proxy, bottom line]
  - term: Net Profit
    definition: >-
      In Summit Supply's management P&L, "net profit" refers to Operating Profit: interest and tax are held at
      corporate and are not in this dataset, so the lowest governed profit line is Operating Profit (gross margin
      less all operating expenses).
    metric_id: operating_profit
    related: [Operating Profit, Operating Plan]
  - term: Profit
    definition: >-
      Ambiguous on its own. Summit reports three profit lines: Gross Margin (revenue - COGS), Contribution Margin
      (gross margin - freight - commission) and Operating Profit (gross margin - all operating expenses). Ask which
      one is meant. "Net profit" is defined separately (see Net Profit).
    candidate_metric_ids: [gross_margin, contribution_margin, operating_profit]
    related: [Margin, Operating Profit, Net Profit]
    synonyms: [profits, making money, losing money, earnings]
  - term: Margin Rate
    definition: >-
      Margin per dollar of revenue. Ambiguous between Gross Margin %, Contribution Margin % and Operating Margin %;
      ask which one is meant.
    candidate_metric_ids: [gross_margin_pct, contribution_margin_pct, operating_margin_pct]
    related: [Margin]
    synonyms: [on every dollar, per dollar of sales, margin percentage, margin rate]
  - term: Volume
    definition: Ambiguous between Units Sold and Orders; ask which one is meant.
    candidate_metric_ids: [units, orders]
    synonyms: [sales volume, business volume]
  - term: Net Income
    definition: >-
      Profit after interest and tax. Not measured in this dataset: interest and tax are held at corporate. The lowest
      governed profit line is Operating Profit (see Net Profit).
    not_measured: true
    synonyms: [net income after tax, after tax profit, after-tax profit, net earnings, profit after tax]
  - term: Days Sales Outstanding
    definition: How long customers take to pay. Receivables are not in this dataset.
    not_measured: true
    synonyms: [DSO, collection days, days to collect, receivables]
  - term: Customer Satisfaction
    definition: Survey-based satisfaction or loyalty scores. Not collected in this dataset.
    not_measured: true
    synonyms: [customer satisfaction score, CSAT, NPS, net promoter score, satisfaction score]
  - term: On-Time Delivery
    definition: Share of deliveries arriving when promised. Delivery promise and arrival times are not in this dataset.
    not_measured: true
    synonyms: [on-time delivery rate, on time delivery, OTIF, delivery performance]
  - term: Cost per Lead
    definition: Marketing spend per lead. Marketing spend is not in this dataset.
    not_measured: true
    synonyms: [CPL, cost per lead, customer acquisition cost, CAC, marketing spend]
  - term: Deal Size
    definition: Average value of won opportunities. Not governed (opportunity amounts are summed as Pipeline Amount only).
    not_measured: true
    synonyms: [average deal size, deal size]
  - term: Employee Turnover
    definition: Share of employees leaving. Separations are not in this dataset (only headcount is).
    not_measured: true
    synonyms: [attrition, staff turnover, employee attrition, turnover rate]
  - term: Revenue Target
    definition: >-
      Monthly revenue quotas per sales rep. FY26 quotas split each branch's FY26 Operating Plan revenue across its
      reps, so "hitting the revenue target" for FY26 means revenue at or above plan revenue.
    metric_id: revenue_target
    related: [Operating Plan, Revenue]
    synonyms: [revenue quota, sales target, target]
  - term: Fuel Surcharge
    definition: >-
      The carrier fuel surcharge billed on deliveries, recorded on each order separately from base freight.
      Freight = base freight + fuel surcharge; there is no other freight line.
    metric_id: fuel_surcharge
    related: [Operating Expenses, Deliveries]
    synonyms: [diesel surcharge, fuel surcharges]
  - term: Labor Cost
    definition: Branch regular payroll plus overtime. Headcount (FTE) below plan with overtime above plan means open positions covered by overtime.
    formula: Payroll + Overtime
    metric_id: labor_cost
    related: [Headcount, Operating Expenses]
    synonyms: [labor, labour, staff cost]
  - term: Budget
    definition: >-
      Branch revenue, gross margin and opex budget from the FP&A workbook (budgets.xlsx). FY26 rows are the branch
      allocation of the FY26 Operating Plan; FY25 rows are last year's budget.
    metric_id: budget_revenue
    related: [Operating Plan, Revenue Target]
  - term: COGS
    definition: Cost of goods sold at the product's standard cost in the order month.
    metric_id: cogs
    related: [Gross Margin]
    synonyms: [cost of goods sold, cost of sales, input costs]
  - term: Unit Cost
    definition: >-
      What Summit pays suppliers per unit (product_costs). Across products it is compared per list-price dollar
      (COGS per List Dollar), because units of different products are not comparable.
    metric_id: cost_to_list_ratio
    related: [COGS, Gross Margin]
    synonyms: [unit costs, supplier cost, input cost inflation]
  - term: Return Rate
    definition: Returned revenue as a share of revenue.
    formula: Returns / Revenue
    metric_id: return_rate
    related: [Returns, Revenue]
