    higher_is_better: false
  - id: plan_overtime
    name: Overtime Plan
    label: Overtime Plan
    description: FY26 Operating Plan overtime per branch.
    kind: simple
    entity: opex_plan
    expr: plan_overtime
    agg: sum
    format: currency
    owner: FP&A
    tags: [plan]
    plan_for: overtime
    default_time_dimension: opex_plan_month
    higher_is_better: false
  - id: plan_occupancy
    name: Occupancy Plan
    label: Occupancy Plan
    description: FY26 Operating Plan occupancy per branch.
    kind: simple
    entity: opex_plan
    expr: plan_occupancy
    agg: sum
    format: currency
    owner: FP&A
    tags: [plan]
    plan_for: occupancy
