  - id: budget_gross_margin
    name: Budget Gross Margin
    label: Budget Gross Margin
    description: Branch gross margin budget from the FP&A workbook. FY26 rows are the branch allocation of the FY26 Operating Plan.
    kind: simple
    entity: budgets_branch
    expr: gross_margin_budget
    agg: sum
    format: currency
    owner: FP&A
    tags: [budget]
    plan_for: gross_margin
