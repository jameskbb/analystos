[project]
name = "analystos-engine"
version = "0.1.0"
description = "AnalystOS analytical engine: ingestion, DuckDB store, profiling, semantic layer, analysis, connectors, sandbox"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pydantic>=2.8",
  "sqlglot>=25",
  "polars>=1.5",
  "pandas>=2.2",
  "pyarrow>=17",
  "openpyxl>=3.1",
  "numpy>=2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "pyyaml>=6",
  "charset-normalizer>=3",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
mysql = ["pymysql>=1.1"]
sqlserver = ["pyodbc>=5.1"]
sqlserver-pymssql = ["pymssql>=2.3"]
snowflake = ["snowflake-connector-python>=3.12"]
bigquery = ["google-cloud-bigquery>=3.25"]
connectors = [
  "psycopg[binary]>=3.2",
  "pymysql>=1.1",
  "pyodbc>=5.1",
  "snowflake-connector-python>=3.12",
  "google-cloud-bigquery>=3.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analystos_engine"]
